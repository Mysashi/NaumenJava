<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Books List</title>
</head>
<body>
<h1>Books list</h1>
<table border="1">
    <tr>
        <th>Name</th>
        <th>Author</th>
    </tr>
    <tr th:each="books : ${books}">
        <td th:text="${books.name}"></td>
        <td th:text="${books.author}"></td>
    </tr>
</table>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Books List</title>
</head>
<body>
<h1>Books list</h1>
<table border="1">
    <tr>
        <th>Name</th>
        <th>Author</th>
    </tr>
    <tr th:each="books : ${books}">
        <td th:text="${books.name}"></td>
        <td th:text="${books.author}"></td>
    </tr>
</table>
<form th:action="@{/logout}" method="post">
    <button type="submit"
            class="w-full py-4 px-8 text-xl font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg shadow-lg transition-transform transform hover:scale-105">
        Выйти
    </button>
</form>
</body>
</html>
